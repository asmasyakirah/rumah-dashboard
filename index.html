<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c9dff0">
<title>Rumah TV</title>
<style>
:root{
  --ink:#263744; --muted:#536875; --glass:rgba(248,252,255,.78);
  --glass-line:rgba(255,255,255,.88); --sage:#9bbd7c; --sage-dark:#607e57;
  --shadow:0 10px 28px rgba(42,67,83,.13);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Roboto,"Arial",sans-serif;color:var(--ink)}
body{background:linear-gradient(180deg,#b8d5e9 0%,#d9e8ee 54%,#dce8cf 100%)}
.scene{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.scene svg{width:100%;height:100%;display:block}
.scrim{position:fixed;inset:0;z-index:1;background:linear-gradient(180deg,rgba(33,61,79,.06),rgba(33,61,79,.03) 55%,rgba(28,48,39,.08));pointer-events:none}
.ui{position:relative;z-index:2;width:100%;height:100%;padding:4.8vh 5.2vw 4vh;display:flex;flex-direction:column;justify-content:space-between}
.top{display:grid;grid-template-columns:1fr 1.05fr;gap:3vw;align-items:center}
.dateblock{color:#fdfdf8;text-shadow:0 2px 8px rgba(32,54,67,.2)}
.date{font-size:clamp(18px,2.05vw,30px);font-weight:500;letter-spacing:.01em}
.hijri{font-size:clamp(13px,1.35vw,19px);margin-top:8px;color:rgba(255,255,255,.9);font-weight:400}
.clockrow{display:flex;align-items:baseline;gap:12px;margin-top:16px;white-space:nowrap}
.clock{font-size:clamp(76px,10vw,150px);font-weight:300;line-height:.92;letter-spacing:-.065em;color:#fff;text-shadow:0 3px 12px rgba(32,54,67,.22);font-variant-numeric:tabular-nums}
.ampm{font-size:clamp(23px,2.8vw,40px);font-weight:400;color:#fff;text-shadow:0 2px 8px rgba(32,54,67,.2)}
.next{justify-self:end;width:min(100%,650px);padding:23px 30px;border:1px solid var(--glass-line);border-radius:27px;background:var(--glass);box-shadow:var(--shadow);backdrop-filter:blur(13px);-webkit-backdrop-filter:blur(13px);display:grid;grid-template-columns:1fr auto 1.25fr;align-items:center;gap:22px}
.nextlabel{font-size:clamp(15px,1.6vw,23px);font-weight:500;color:#334957}
.nextname{font-size:clamp(32px,4vw,58px);font-weight:500;line-height:1.08;margin-top:7px}
.nextdivider{height:72px;width:1px;background:rgba(48,69,82,.25)}
.count{font-size:clamp(31px,3.5vw,52px);font-weight:400;letter-spacing:.015em;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:center}
.countcaption{font-size:10px;letter-spacing:.14em;text-align:center;color:#617582;margin-top:5px}
.timelinewrap{margin-top:2.4vh;padding:20px 2.3vw 16px;border-radius:25px;background:rgba(248,252,255,.72);border:1px solid rgba(255,255,255,.9);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.timeline{position:relative;height:112px;margin:0 1.3vw}
.track{position:absolute;left:0;right:0;top:24px;height:5px;background:rgba(76,99,110,.28);border-radius:9px}
.progress{position:absolute;left:0;top:24px;height:5px;width:0;background:linear-gradient(90deg,#bdd49a,#86ad70);border-radius:9px}
.tick{position:absolute;top:17px;width:1px;height:18px;background:rgba(72,91,100,.3)}
.ticklabel{position:absolute;top:46px;transform:translateX(-50%);font-size:clamp(9px,.85vw,12px);color:#657782;white-space:nowrap}
.prayermarker{position:absolute;top:15px;transform:translateX(-50%);text-align:center;min-width:60px}
.dot{width:19px;height:19px;margin:0 auto 10px;border-radius:50%;background:#fff;border:2px solid #8da2a6;box-shadow:0 1px 4px rgba(40,60,70,.14)}
.prayermarker.nextmarker .dot{width:24px;height:24px;margin-top:-2px;background:#a6c981;border:3px solid #fff;box-shadow:0 0 0 2px #8eae70}
.pname{font-size:clamp(11px,1.1vw,15px);font-weight:600;color:#344d5b;white-space:nowrap}
.ptime{font-size:clamp(10px,1vw,14px);color:#627783;margin-top:4px;white-space:nowrap}
.apps{display:flex;justify-content:center;gap:clamp(14px,2.2vw,34px);margin-top:2vh}
.app{width:clamp(120px,14vw,205px);height:clamp(105px,13vw,165px);border-radius:24px;border:1px solid rgba(255,255,255,.94);background:rgba(250,252,255,.78);box-shadow:var(--shadow);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#304957;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s;outline:none}
.app:focus,.app:hover{transform:translateY(-4px) scale(1.025);background:rgba(255,255,255,.96);box-shadow:0 0 0 3px rgba(255,255,255,.7),0 12px 30px rgba(42,67,83,.2)}
.app svg{width:clamp(31px,3.7vw,52px);height:clamp(31px,3.7vw,52px);stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app.youtube .play{fill:#e75c55;stroke:#e75c55}
.app.youtube .playtri{fill:white;stroke:white}
.app.netflix .n{font-size:clamp(37px,4vw,56px);font-weight:800;color:#d94343;line-height:1}
.applabel{font-size:clamp(14px,1.35vw,19px);font-weight:500}
.footer{display:flex;justify-content:space-between;color:rgba(255,255,255,.88);font-size:11px;text-shadow:0 1px 5px rgba(28,48,58,.25);margin-top:1vh}
.status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;padding:9px 15px;border-radius:20px;background:rgba(35,53,63,.86);color:#fff;font-size:12px;display:none}
.status.show{display:block}
.modal{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(29,48,58,.3);padding:20px}
.modal.show{display:flex}
.modalbox{width:min(420px,95vw);padding:25px;border-radius:22px;background:rgba(248,252,255,.96);box-shadow:0 15px 50px rgba(0,0,0,.2)}
.modalbox h2{font-size:22px;font-weight:500;margin:0 0 14px}
.modalbox p{font-size:14px;line-height:1.55;color:#5d707b}
.modalactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.modalactions button{border:0;border-radius:12px;padding:10px 17px;background:#78966a;color:white;font-size:14px}
@media(max-width:800px){
 .ui{padding:4vh 4vw 3vh}.top{grid-template-columns:1fr;gap:16px}.next{justify-self:stretch;width:100%}
 .timelinewrap{margin-top:2vh}.apps{gap:8px}.app{width:18%;height:90px;border-radius:17px}.applabel{font-size:11px}
 .footer{display:none}
}
</style>
</head>
<body>

</div>
<div class="scrim"></div>
<div class="ui">
 <section class="top">
  <div class="dateblock">
   <div class="date" id="date">Monday, 2 November 2026</div>
   <div class="hijri" id="hijri">Islamic date</div>
   <div class="clockrow"><div class="clock" id="clock">9:41</div><div class="ampm" id="ampm">AM</div></div>
  </div>
  <div class="next" aria-live="polite">
   <div><div class="nextlabel">Next Prayer</div><div class="nextname" id="nextName">Loading</div></div>
   <div class="nextdivider"></div>
   <div><div class="count" id="countdown">--:--:--</div><div class="countcaption">HOURS · MINUTES · SECONDS</div></div>
  </div>
 </section>

 <section class="timelinewrap" aria-label="Prayer timeline from 5 AM to 2 AM">
  <div class="timeline" id="timeline">
   <div class="track"></div><div class="progress" id="progress"></div>
   <div id="ticks"></div><div id="markers"></div>
  </div>
 </section>

 <nav class="apps" aria-label="TV apps">
  <button class="app" type="button" data-app="tv" aria-label="TV">
   <svg viewBox="0 0 48 48"><rect x="6" y="9" width="36" height="26" rx="3"/><path d="M18 42h12M24 35v7"/></svg><span class="applabel">TV</span>
  </button>
  <a class="app youtube" href="https://www.youtube.com/tv" target="_blank" rel="noopener" aria-label="YouTube">
   <svg viewBox="0 0 48 48"><rect class="play" x="4" y="9" width="40" height="30" rx="9"/><path class="playtri" d="M20 16l13 8-13 8z"/></svg><span class="applabel">YouTube</span>
  </a>
  <a class="app netflix" href="https://www.netflix.com" target="_blank" rel="noopener" aria-label="Netflix">
   <span class="n">N</span><span class="applabel">Netflix</span>
  </a>
  <a class="app" href="https://www.google.com" target="_blank" rel="noopener" aria-label="Browser">
   <svg viewBox="0 0 48 48"><circle cx="24" cy="24" r="19"/><path d="M5 24h38M24 5c7 7 10 13 10 19s-3 12-10 19M24 5c-7 7-10 13-10 19s3 12 10 19M9 13h30M9 35h30"/></svg><span class="applabel">Browser</span>
  </a>
  <button class="app" type="button" data-app="others" aria-label="Others">
   <svg viewBox="0 0 48 48"><rect x="7" y="7" width="13" height="13" rx="3"/><rect x="28" y="7" width="13" height="13" rx="3"/><rect x="7" y="28" width="13" height="13" rx="3"/><rect x="28" y="28" width="13" height="13" rx="3"/></svg><span class="applabel">Others</span>
  </button>
 </nav>
 <footer class="footer"><span>RUMAH</span><span>Desa Petaling · Kuala Lumpur · WLY01</span></footer>
</div>
<div class="status" id="status"></div>
<div class="modal" id="modal"><div class="modalbox"><h2 id="modalTitle">TV</h2><p id="modalText"></p><div class="modalactions"><button id="modalClose">Close</button></div></div></div>
<script>
(function(){
"use strict";
const ZONE="WLY01";
const PRAYERS=[["Subuh","fajr"],["Zohor","dhuhr"],["Asar","asr"],["Maghrib","maghrib"],["Isyak","isha"]];
const $=id=>document.getElementById(id);
let times=null, lastDate="", statusTimer=null;
function showStatus(message){const el=$("status");el.textContent=message;el.classList.add("show");clearTimeout(statusTimer);statusTimer=setTimeout(()=>el.classList.remove("show"),3500)}
function dateKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parseTime(value){if(!value)return null;const m=String(value).match(/(\\d{1,2}):(\\d{2})/);return m?Number(m[1])*60+Number(m[2]):null}
function fmt12(mins){let h=Math.floor(mins/60)%24,m=mins%60;return ((h%12)||12)+":"+String(m).padStart(2,"0")+" "+(h>=12?"PM":"AM")}
function localTime(d){let h=d.getHours(),m=d.getMinutes();return ((h%12)||12)+":"+String(m).padStart(2,"0")}
function getPrayerDay(data,d){
 const arr=data && data.prayerTime;
 if(!Array.isArray(arr))return null;
 const target=dateKey(d);
 return arr.find(x=>{
  const raw=String(x.date||"");
  const parsed=new Date(raw);
  return raw===target || (!isNaN(parsed.getTime()) && dateKey(parsed)===target);
 }) || arr[0] || null;
}
async function loadPrayerTimes(){
 const now=new Date(), today=dateKey(now);
 try{
  const url="https://www.e-solat.gov.my/index.php?r=esolatApi/takwimsolat&period=week&zone="+ZONE;
  const response=await fetch(url,{cache:"no-store"});
  if(!response.ok)throw new Error("JAKIM returned "+response.status);
  const data=await response.json(), day=getPrayerDay(data,now);
  if(!day)throw new Error("Prayer data unavailable");
  const next={};
  PRAYERS.forEach(([label,key])=>{next[label]=parseTime(day[key])});
  next.Syuruk=parseTime(day.syuruk);
  if(PRAYERS.some(([label])=>next[label]===null))throw new Error("Incomplete prayer data");
  times=next;lastDate=today;renderTimeline();tick();
  showStatus("Prayer times updated from JAKIM · WLY01");
 }catch(err){
  showStatus("Could not load JAKIM timings. Check internet or refresh.");
  $("nextName").textContent="Prayer data unavailable";
 }
}
function renderTimeline(){
 const start=5*60,end=26*60,span=end-start;
 const ticks=$("ticks"),markers=$("markers");ticks.innerHTML="";markers.innerHTML="";
 for(let t=start;t<=end;t+=30){
  const x=(t-start)/span*100;
  const tick=document.createElement("div");tick.className="tick";tick.style.left=x+"%";ticks.appendChild(tick);
  if(t%120===0 || t===end){
   const label=document.createElement("div");label.className="ticklabel";label.style.left=x+"%";
   const hour=(Math.floor(t/60)%24),ampm=hour>=12?"PM":"AM";
   label.textContent=((hour%12)||12)+(t===end?" AM":" "+ampm);ticks.appendChild(label);
  }
 }
 const now=new Date(),nowMin=now.getHours()*60+now.getMinutes(),adjustedNow=nowMin<start?nowMin+1440:nowMin;
 const progress=Math.max(0,Math.min(100,(adjustedNow-start)/span*100));$("progress").style.width=progress+"%";
 const all=[["Subuh",times.Subuh],["Syuruk",times.Syuruk],["Zohor",times.Zohor],["Asar",times.Asar],["Maghrib",times.Maghrib],["Isyak",times.Isyak]];
 let upcomingName=null,upcomingTime=null;
 for(const [name,t] of all){if(t!==null && t>nowMin && (name!=="Syuruk")){upcomingName=name;upcomingTime=t;break}}
 if(!upcomingName){upcomingName="Subuh";upcomingTime=times.Subuh+1440}
 all.forEach(([name,t])=>{
  if(t===null)return;
  const x=(t-start)/span*100;
  const marker=document.createElement("div");marker.className="prayermarker"+(name===upcomingName?" nextmarker":"");marker.style.left=x+"%";
  const dot=document.createElement("div");dot.className="dot";
  const nm=document.createElement("div");nm.className="pname";nm.textContent=name;
  const tm=document.createElement("div");tm.className="ptime";tm.textContent=fmt12(t);
  marker.append(dot,nm,tm);markers.appendChild(marker);
 });
 $("nextName").textContent=upcomingName;
}
function tick(){
 const d=new Date(),today=dateKey(d);
 $("clock").textContent=localTime(d);$("ampm").textContent=d.getHours()>=12?"PM":"AM";
 $("date").textContent=d.toLocaleDateString("en-MY",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
 try{$("hijri").textContent=new Intl.DateTimeFormat("en-TN-u-ca-islamic",{day:"numeric",month:"long",year:"numeric"}).format(d)+"H"}catch(e){$("hijri").textContent=""}
 if(today!==lastDate){loadPrayerTimes();return}
 if(!times)return;
 const now=d.getHours()*60+d.getMinutes(),sec=d.getSeconds();
 let next=null,nextAt=null;
 for(const [name] of PRAYERS){const t=times[name];if(t>now){next=name;nextAt=t;break}}
 if(!next){next="Subuh";nextAt=times.Subuh+1440}
 $("nextName").textContent=next;
 let diff=(nextAt-now)*60-sec;if(diff<0)diff=0;
 const hh=Math.floor(diff/3600),mm=Math.floor(diff%3600/60),ss=diff%60;
 $("countdown").textContent=[hh,mm,ss].map(v=>String(v).padStart(2,"0")).join(":");
 const progressNow=Math.max(0,Math.min(100,((now<300?now+1440:now)-300)/(1560-300)*100));
 $("progress").style.width=progressNow+"%";
}
function modal(title,text){$("modalTitle").textContent=title;$("modalText").textContent=text;$("modal").classList.add("show")}
$("modalClose").addEventListener("click",()=>$("modal").classList.remove("show"));
document.querySelector('[data-app="tv"]').addEventListener("click",()=>modal("TV","Use your Hisense remote to switch to Live TV. A browser page cannot directly change the television input."));
document.querySelector('[data-app="others"]').addEventListener("click",()=>modal("More apps","Add your favourite app links here in a future update. You can also use the TV's Home screen to open installed VIDAA apps."));
loadPrayerTimes();tick();setInterval(tick,1000);setInterval(loadPrayerTimes,6*60*60*1000);
})();
</script>
</body></html>
